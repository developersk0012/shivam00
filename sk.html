<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK Admin</title><link rel="stylesheet" href="style.css"></head><body class="adminpage"><header><div class="brand"><span>SK</span><b>SK Education Control</b></div><span class="pill">ADMIN</span></header><main class="dash"><div class="stats"><div><b id="u">0</b><small>Users</small></div><div><b id="m">0</b><small>Messages</small></div><div><b id="s">TEST</b><small>Status</small></div></div>

<section class="card panel"><h2>📊 Analysis</h2><div class="mini"><span>Messages today</span><b id="today">0</b></div><div class="mini"><span>Unread</span><b id="unread">0</b></div></section>
<section class="card panel"><h2>👥 Users Management</h2><div id="users">No users yet.</div></section>
