<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SK Admin Panel</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-body">
<header class="admin-top"><div class="brand"><span class="logo3d">SK</span><b>SK Education Control</b></div><span class="pill">ADMIN</span></header>
<main class="dashboard">
<section class="stats"><div class="stat"><b id="users">0</b><small>Users</small></div><div class="stat"><b id="messages">0</b><small>Messages</small></div><div class="stat"><b>LIVE</b><small>Chat bridge</small></div></section>
<section class="panel"><h2>Admin Inbox</h2><p>Telegram replies can be bridged here as a fallback. This prototype keeps the UI ready; the secure server connection is configured separately.</p><div class="inbox"><div><b>Conversation</b><span>Waiting for Firebase</span></div><button onclick="location.href='chat.html'">Open test chat</button></div></section>
<section class="panel"><h2>Management</h2><div class="manage-grid"><button>User Management</button><button>Chat Analysis</button><button>Settings</button><button>Announcements</button></div></section>
</main></body></html>
