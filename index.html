<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#f5f7ff;height:100vh;overflow:hidden}
.app{height:100vh;display:flex}.side{width:260px;background:#0f1629;border-right:1px solid #202a43;padding:16px;display:flex;flex-direction:column}
.brand{font-size:21px;font-weight:800;padding:8px 8px 20px}.brand span{color:#8b7cff}
.new{width:100%;border:1px solid #303b59;background:#171f35;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;cursor:pointer}
.tip{margin-top:auto;color:#8290ad;font-size:12px;line-height:1.5;padding:10px}.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:64px;border-bottom:1px solid #202a43;display:flex;align-items:center;padding:0 22px;font-weight:700}.status{margin-left:auto;color:#7fe3aa;font-size:12px;display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#49d788}
.chat{flex:1;overflow:auto;padding:28px max(18px,calc((100% - 850px)/2))}
.welcome{text-align:center;margin:10vh auto 0;max-width:650px}.logo{width:64px;height:64px;margin:auto;border-radius:20px;background:linear-gradient(135deg,#8b7cff,#35c8ff);display:grid;place-items:center;font-size:28px;font-weight:900;box-shadow:0 12px 40px #0005}
h1{font-size:32px;margin:18px 0 8px}.welcome p{color:#8996b2;margin:0}.examples{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}.ex{background:#121b31;border:1px solid #26324d;color:#cbd3e6;padding:13px;border-radius:12px;text-align:left;cursor:pointer}.ex:hover{border-color:#6f63db}
.msg{display:flex;gap:12px;margin:18px 0;align-items:flex-start}.avatar{flex:0 0 34px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#202a43;font-size:13px;font-weight:800}.user .avatar{background:#5d50d8}.bubble{max-width:760px;line-height:1.65;white-space:pre-wrap;color:#e9edfa}.user .bubble{background:#171f35;border:1px solid #26324d;padding:11px 14px;border-radius:14px}
.composer{padding:14px 18px 20px}.box{max-width:850px;margin:auto;background:#121a2e;border:1px solid #303b59;border-radius:16px;padding:9px;display:flex;align-items:flex-end;box-shadow:0 15px 50px #0004}.box textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;padding:9px 10px;max-height:140px;font:inherit}.send{width:42px;height:42px;border:0;border-radius:12px;background:#7769ed;color:#fff;font-size:19px;cursor:pointer}.send:disabled{opacity:.45}.foot{text-align:center;color:#596780;font-size:11px;margin-top:8px}
@media(max-width:700px){.side{display:none}.top{padding:0 16px}.chat{padding:18px 14px}.welcome{margin-top:7vh}.examples{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">✦ <span>AI</span> Chat</div>
  <button class="new" id="newChat">＋ New chat</button>
  <div class="tip">Your API key stays on the server. Never put it directly in browser JavaScript.</div>
</aside>
<main class="main">
  <header class="top">AI Assistant <div class="status"><i class="dot"></i> Online</div></header>
  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="logo">AI</div><h1>How can I help you?</h1>
      <p>Ask anything and start a conversation.</p>
      <div class="examples">
        <button class="ex">Explain quantum computing simply</button>
        <button class="ex">Write a professional email</button>
        <button class="ex">Give me 5 creative ideas</button>
        <button class="ex">Help me learn JavaScript</button>
      </div>
    </div>
  </section>
  <div class="composer">
    <div class="box"><textarea id="input" rows="1" placeholder="Message AI..."></textarea><button class="send" id="send">➤</button></div>
    <div class="foot">AI can make mistakes. Check important information.</div>
  </div>
</main>
</div>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("input"), send=document.getElementById("send"), welcome=document.getElementById("welcome");
let messages=[];

function add(role,text){
  if(welcome) welcome.remove();
  const row=document.createElement("div"); row.className="msg "+role;
  const av=document.createElement("div"); av.className="avatar"; av.textContent=role==="user"?"You":"AI";
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
  row.append(av,b); chat.appendChild(row); chat.scrollTop=chat.scrollHeight; return b;
}
async function ask(){
  const text=input.value.trim(); if(!text||send.disabled)return;
  input.value=""; input.style.height="auto"; add("user",text); messages.push({role:"user",content:text});
  send.disabled=true; const bubble=add("assistant","Thinking…");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||"Request failed");
    bubble.textContent=d.reply; messages.push({role:"assistant",content:d.reply});
  }catch(e){bubble.textContent="⚠️ "+e.message}
  finally{send.disabled=false;input.focus()}
}
send.onclick=ask;
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"});
document.querySelectorAll(".ex").forEach(x=>x.onclick=()=>{input.value=x.textContent;input.focus();});
document.getElementById("newChat").onclick=()=>{messages=[];chat.innerHTML='<div class="welcome" id="welcome"><div class="logo">AI</div><h1>How can I help you?</h1><p>Ask anything and start a conversation.</p><div class="examples"><button class="ex">Explain quantum computing simply</button><button class="ex">Write a professional email</button><button class="ex">Give me 5 creative ideas</button><button class="ex">Help me learn JavaScript</button></div></div>';document.querySelectorAll(".ex").forEach(x=>x.onclick=()=>{input.value=x.textContent;input.focus()});};
</script>
</body>
</html>
